# 发票识别自动化流水线
# ---------------------------------------------------------------------------
# 触发方式：push / pull_request 到 main，工作日 09:10（UTC+8）定时，以及手动
#          workflow_dispatch（可指定 input_dir 与 min_confidence）。
#
# 三个 job：
#   selftest       —— 零依赖自检，任何改动都必须先过（含 UiPath 版 XAML 生成校验）
#   regression     —— 装齐依赖跑真实样本，断言台账结论稳定
#   scheduled-run  —— 工作日定时"自动入账"，产出物存 artifact 并提交台账
#
# 维护提示：GitHub 规定用 OAuth App token（如 gh CLI 凭据）推送
#   `.github/workflows/` 下的文件时，token 必须带 workflow 权限，
#   否则整次 push 会被拒绝：
#     refusing to allow an OAuth App to create or update workflow ... without `workflow` scope
#   本机已执行 `gh auth refresh -h github.com -s workflow` 补上该权限。
#   若换了机器或凭据，需要重新补一次（或用 GitHub 网页端编辑本文件，网页端不受此限制）。
# ---------------------------------------------------------------------------
name: 发票识别流水线

on:
  push:
    branches: [main, master]
    paths:
      - "optimized_python/**"
      - "optimized_uipath/**"
      - "invoice_wf/**"
      - "*.py"
      - "requirements.txt"
      - ".github/**"
  pull_request:
    branches: [main, master]
  schedule:
    # 工作日 09:10（UTC+8）自动入账一次
    - cron: "10 1 * * 1-5"
  workflow_dispatch:
    inputs:
      input_dir:
        description: "发票目录（相对仓库根）"
        required: false
        default: "invoices_input"
      min_confidence:
        description: "置信度阈值"
        required: false
        default: "0.75"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  selftest:
    name: 自检 ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查
        run: python -m py_compile optimized_python/idle_invoice_bot.py

      - name: 内置自检（零依赖路径）
        run: python optimized_python/idle_invoice_bot.py --selftest

      - name: 打印生效配置与规则清单
        run: python optimized_python/idle_invoice_bot.py --explain

      - name: UiPath 版 XAML 生成与转义自校验
        run: python optimized_uipath/build_xaml.py

  regression:
    name: 样本回归 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（PDF 文本层 + Excel 台账 + 图片）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf openpyxl pillow

      # 注意：这里**不重新生成样本**。
      # 回归测试要验证的是"仓库里这批 PDF 的识别结论是否稳定"，
      # 而 make_*_samples.py 是用 PyMuPDF 现场生成 PDF —— 不同 runner 上的
      # PyMuPDF 版本不同，生成出来的字节与文本顺序也不同，会让结论随版本漂移，
      # 断言就失去了意义（曾经因此把 CI 弄红两次，排查半天）。
      # 生成器本身另有单独的一步做冒烟测试（见下）。
      - name: 清空输出目录
        run: python .github/scripts/clean_output.py optimized_python/output_v2

      - name: 全量处理
        # 用包装脚本运行：机器人退出码 2 = 「存在待人工处理的项」，
        # 而样本集里故意埋了边界用例，所以 2 属预期、不算失败；
        # 真正的判定交给下一步的 assert_ledger.py。
        run: >-
          python .github/scripts/run_and_check.py
          optimized_python/idle_invoice_bot.py --
          -i invoices_input -o optimized_python/output_v2

      - name: 断言台账结论
        run: python .github/scripts/assert_ledger.py optimized_python/output_v2/发票明细.json

      - name: 生成器冒烟测试（能生成、能被识别，不断言具体结果）
        # 与上面的回归分开：这里只保证生成脚本还能跑、生成的 PDF 还能被读到，
        # 不把"生成结果"写进回归基准。
        run: |
          python make_samples.py
          python make_intl_samples.py

      - name: 诊断（仅断言失败时运行）
        if: failure()
        run: python .github/scripts/diag_views.py

      - name: 上传产出（台账 / 报告 / 待复核 / 审计）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-output-${{ matrix.os }}
          path: optimized_python/output_v2/
          if-no-files-found: warn
          retention-days: 30

  scheduled-run:
    name: 定时入账
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install pymupdf openpyxl pillow

      - name: 处理
        # 同样用包装脚本：退出码 2 属预期，不当作失败
        run: |
          python .github/scripts/run_and_check.py \
            optimized_python/idle_invoice_bot.py -- \
            -i "${{ github.event.inputs.input_dir || 'invoices_input' }}" \
            -o optimized_python/output_v2

      - name: 断言台账结论
        run: python .github/scripts/assert_ledger.py optimized_python/output_v2/发票明细.json

      - name: 提交台账变更（历史可追溯）
        run: |
          git config user.name  "invoice-bot"
          git config user.email "invoice-bot@users.noreply.github.com"
          git add -A optimized_python/output_v2 || true
          git diff --staged --quiet || git commit -m "chore(发票台账): 自动入账"
          git push || true

      - uses: actions/upload-artifact@v4
        with:
          name: invoice-output-scheduled
          path: optimized_python/output_v2/
          retention-days: 90
