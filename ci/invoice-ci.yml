# 发票识别自动化流水线
# ---------------------------------------------------------------------------
# ⚠ 如何启用（本文件放在 ci/ 而不是 .github/workflows/ 是有原因的）
#
#   GitHub 规定：用 OAuth App token（例如 gh CLI 的登录凭据）推送
#   `.github/workflows/` 下的文件时，token 必须带 workflow 权限，
#   否则整次 push 都会被拒绝，报：
#     refusing to allow an OAuth App to create or update workflow ... without `workflow` scope
#
#   所以本文件先落在 ci/ 目录里（内容完整、照样进版本库），启用方式二选一：
#
#   方式一（推荐，一次搞定）：
#       gh auth refresh -h github.com -s workflow
#       git mv ci/invoice-ci.yml .github/workflows/invoice-ci.yml
#       git commit -m "ci: 启用流水线" && git push
#
#   方式二（不想动 token 权限）：
#       在 GitHub 网页端 → Actions → set up a workflow yourself，
#       把本文件内容原样粘进去，提交即可。网页端不受上述 scope 限制。
#
# 三个 job：
#   selftest       —— 零依赖自检，任何改动都必须先过（含 UiPath 版 XAML 生成校验）
#   regression     —— 装齐依赖跑真实样本，断言台账结论稳定
#   scheduled-run  —— 工作日定时"自动入账"，产出物存 artifact 并提交台账
# ---------------------------------------------------------------------------
name: 发票识别流水线

on:
  push:
    branches: [main, master]
    paths:
      - "optimized_python/**"
      - "optimized_uipath/**"
      - "invoice_wf/**"
      - "*.py"
      - "requirements.txt"
      - ".github/**"
  pull_request:
    branches: [main, master]
  schedule:
    # 工作日 09:10（UTC+8）自动入账一次
    - cron: "10 1 * * 1-5"
  workflow_dispatch:
    inputs:
      input_dir:
        description: "发票目录（相对仓库根）"
        required: false
        default: "invoices_input"
      min_confidence:
        description: "置信度阈值"
        required: false
        default: "0.75"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  selftest:
    name: 自检 ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查
        run: python -m py_compile optimized_python/idle_invoice_bot.py

      - name: 内置自检（零依赖路径）
        run: python optimized_python/idle_invoice_bot.py --selftest

      - name: 打印生效配置与规则清单
        run: python optimized_python/idle_invoice_bot.py --explain

      - name: UiPath 版 XAML 生成与转义自校验
        run: python optimized_uipath/build_xaml.py

  regression:
    name: 样本回归 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（PDF 文本层 + Excel 台账 + 图片）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf openpyxl pillow

      - name: 生成演示样本
        run: |
          python make_samples.py
          python make_intl_samples.py

      - name: 清空输出目录
        run: python .github/scripts/clean_output.py optimized_python/output_v2

      - name: 全量处理
        run: python optimized_python/idle_invoice_bot.py -i invoices_input -o optimized_python/output_v2

      - name: 断言台账结论
        run: python .github/scripts/assert_ledger.py optimized_python/output_v2/发票明细.json

      - name: 上传产出（台账 / 报告 / 待复核 / 审计）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-output-${{ matrix.os }}
          path: optimized_python/output_v2/
          if-no-files-found: warn
          retention-days: 30

  scheduled-run:
    name: 定时入账
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install pymupdf openpyxl pillow

      - name: 处理
        run: |
          python optimized_python/idle_invoice_bot.py \
            -i "${{ github.event.inputs.input_dir || 'invoices_input' }}" \
            -o optimized_python/output_v2

      - name: 提交台账变更（历史可追溯）
        run: |
          git config user.name  "invoice-bot"
          git config user.email "invoice-bot@users.noreply.github.com"
          git add -A optimized_python/output_v2 || true
          git diff --staged --quiet || git commit -m "chore(发票台账): 自动入账"
          git push || true

      - uses: actions/upload-artifact@v4
        with:
          name: invoice-output-scheduled
          path: optimized_python/output_v2/
          retention-days: 90
