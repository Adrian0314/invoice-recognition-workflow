<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发票识别工作流 · 在线版</title>
<!--
  GitHub Pages 必须从**仓库根**发布，网站才能直接引用 ../optimized_python/ 与 ../samples/。
  但站点本身放在 docs/ 里（保持仓库根整洁），所以这里做一个保留查询串的跳转入口：
      根地址                      → docs/index.html
      根地址?selftest=1           → docs/index.html?selftest=1（自检模式同样可用）
-->
<link rel="canonical" href="docs/">
<meta http-equiv="refresh" content="0; url=docs/">
<style>
  body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       background:#f6f7f9;color:#1b1f24;display:grid;place-items:center;min-height:100vh}
  .b{text-align:center;padding:32px}
  a{color:#1f6feb}
  .m{color:#5a636e;font-size:13.5px;margin-top:8px}
</style>
</head>
<body>
<div class="b">
  <p>正在进入 <strong>发票识别工作流 · 在线版</strong>…</p>
  <p class="m">若没有自动跳转，请点这里：<a id="go" href="docs/">docs/</a></p>
</div>
<script>
  // 保留查询串，这样 ?selftest=1 之类的参数在跳转后依然生效
  location.replace('docs/' + location.search + location.hash);
</script>
</body>
</html>
